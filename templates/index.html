<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Web</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 15px; }
        .radio-group { margin-bottom: 20px; }
        .radio-group label { margin-right: 15px; }
        input[type="submit"] { padding: 10px 20px; background-color: #007BFF; color: white; border: none; cursor: pointer; border-radius: 4px; }
        input[type="submit"]:hover { background-color: #0056b3; }
        pre { background-color: #f4f4f4; padding: 15px; border-radius: 4px; overflow-x: auto; font-family: monospace; white-space: pre; }
    </style>
</head>
<body>
    <h1>ASCII Art Generator</h1>
    
    <form action="/ascii-art" method="POST">
        <label for="text">Enter Text:</label>
        <textarea id="text" name="text" placeholder="Type something here..." required>{{.Text}}</textarea>

        <div class="radio-group">
            <p>Select Banner Style:</p>
            <input type="radio" id="standard" name="banner" value="standard" {{if or (eq .Banner "standard") (not .Banner)}}checked{{end}}>
            <label for="standard">Standard</label>

            <input type="radio" id="shadow" name="banner" value="shadow" {{if eq .Banner "shadow"}}checked{{end}}>
            <label for="shadow">Shadow</label>

            <input type="radio" id="thinkertoy" name="banner" value="thinkertoy" {{if eq .Banner "thinkertoy"}}checked{{end}}>
            <label for="thinkertoy">Thinkertoy</label>
        </div>

        <input type="submit" value="Generate ASCII Art">
    </form>

    {{if .Result}}
    <h2>Result:</h2>
    <pre>{{.Result}}</pre>
    {{end}}
</body>
</html>
